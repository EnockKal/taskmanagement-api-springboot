spring.application.name=taskmanagement-api-springboot

# PostgreSQL DB
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanagementApi
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.cloudwatch.log-group-name=taskmanager-api-logs
aws.cloudwatch.log-stream-name=taskmanager-api-log-stream
aws.sqs.url=https://sqs.us-east-2.amazonaws.com/260630308232/taskmanager-attachment-events-queue